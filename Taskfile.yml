version: '3'

vars:
  APP_NAME: azure-prj001
  IMAGE_NAME: azure-prj001-api
  IMAGE_TAG: dev
  KIND_CLUSTER: azure-prj001

tasks:

  default:
    desc: List available project tasks
    cmds:
      - task --list

  setup:
    desc: Create the Python virtual environment and install dependencies
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install --upgrade pip
      - .venv/bin/pip install -r app/requirements-dev.txt

  test:
    desc: Run application tests
    cmds:
      - .venv/bin/pytest -v

  app:run:
    desc: Run the API locally
    cmds:
      - .venv/bin/uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  smoke:
    desc: Run basic API smoke tests
    cmds:
      - curl --fail --silent http://localhost:8000/health
      - echo
      - curl --fail --silent http://localhost:8000/ready
      - echo

  build:
    desc: Build the application container
    cmds:
      - docker build
        -t {{.IMAGE_NAME}}:{{.IMAGE_TAG}}
        -f app/Dockerfile
        .

  container:run:
    desc: Run the application container locally in background
    cmds:
      - docker run
        --detach
        --rm
        --name {{.APP_NAME}}
        -p 8000:8000
        {{.IMAGE_NAME}}:{{.IMAGE_TAG}}

  container:stop:
    desc: Stop the application container
    cmds:
      - docker stop {{.APP_NAME}} || true

  clean:
    desc: Remove local Python build and test pytest_cache
    cmds:
      - rm -rf .pytest_cache
      - find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - rm -rf .venv

  kind:create:
    desc: Create the local Kubernetes cluster (kind)
    cmds:
      - kind create cluster
        --name {{.KIND_CLUSTER}}
        --wait 60s

  kind:load:
    desc: Load the application image into the kind cluster
    cmds:
      - kind load docker-image
        {{.IMAGE_NAME}}:{{.IMAGE_TAG}}
        --name {{.KIND_CLUSTER}}

  kind:deploy:
    desc: Deploy the application to Kubernetes
    cmds:
      - kubectl apply -f kubernetes/

  kind:status:
    desc: Show application Kubernetes resources
    cmds:
      - kubectl get deployment
      - kubectl get pods
      - kubectl get service

  kind:forward:
    desc: Forward the Kubernetes service to localhost:8000
    cmds:
      - kubectl port-forward
        service/{{.APP_NAME}}-api
        8000:80
  
  kind:destroy:
    desc: Delete the local Kubernetes cluster
    cmds:
      - kind delete cluster
        --name {{.KIND_CLUSTER}}

  kind:restart:
    desc: Restart the Kubernetes deployment
    cmds:
      - kubectl rollout restart deployment/{{.APP_NAME}}-api

  kind:pods:
    desc: Show application pods
    cmds:
      - kubectl get pods -o wide


