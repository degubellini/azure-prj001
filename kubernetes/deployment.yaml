apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-prj001-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: azure-prj001-api

  template:
    metadata:
      labels:
        app: azure-prj001-api

    spec:
      securityContext:
        runAsNonRoot: true

      containers:
        - name: api
          image: azure-prj001-api:dev
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 256Mi

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10


